name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # Exact pin: the publish path must not float on a bad pytest release.
        run: pip install . pytest==9.1.1

      - name: Run test suite
        run: PYTHONPATH=src pytest

  build-and-publish:
    name: Build distribution and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/raindrop-cli
    permissions:
      id-token: write
      contents: write # the release step cuts the GitHub Release from the tag

    steps:
      # Full history: --notes-from-tag reads the annotated tag's message from
      # the local git object, and a shallow checkout fetches no tags, which
      # made gh fall back to the commit message (seen on the v0.7.0 release).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      - name: Create the GitHub Release from the tag
        # The annotated tag message is the verbatim patchnotes entry, so
        # --notes-from-tag reproduces it by construction and future tags
        # cannot end up bare of a Release.
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
