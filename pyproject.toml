[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raindrop-cli"
description = "A stdlib-only command-line client for Raindrop.io and Pinboard, with two-way bookmark sync"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Brandon LaRocque" }]
keywords = [
    "raindrop",
    "raindrop.io",
    "pinboard",
    "bookmarks",
    "bookmark-manager",
    "sync",
    "cli",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
dependencies = []

[project.scripts]
rd = "rd_cli.cli:main"

[project.urls]
Homepage = "https://github.com/VirInvictus/raindrop-cli"
Changelog = "https://github.com/VirInvictus/raindrop-cli/blob/main/patchnotes.md"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/rd_cli"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
