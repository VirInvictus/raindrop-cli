name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # Exact pin: the publish path must not float on a bad pytest release.
        run: pip install . pytest==9.1.1

      - name: Run test suite
        run: PYTHONPATH=src pytest

  build-and-publish:
    name: Build distribution and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/raindrop-cli
    permissions:
      id-token: write
      contents: write # the release step cuts the GitHub Release from the tag

    steps:
      # Full history so the local tag-object read below has the repo; gh's
      # --notes-from-tag is NOT used: inside Actions it silently falls back
      # to the commit message (seen on the v0.7.0 release; fleet-documented
      # in Catagotchi issue #2).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      # checkout rewrites refs/tags/vX to the resolved commit SHA even after
      # a full fetch (deadbeef-cui v2.0.1 precedent), so the annotated object
      # must be re-fetched --force right before it is read.
      - name: Fetch the annotated tag object
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

      - name: Create the GitHub Release from the tag
        # The annotated tag message is the verbatim patchnotes entry; it is
        # read straight off the local tag object, and an unannotated tag
        # fails the job instead of publishing a fallback body (Catagotchi
        # issue #2's deterministic pattern, proven on v4.51.2).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          OT="$(git for-each-ref "refs/tags/$TAG" --format='%(objecttype)')"
          if [ "$OT" != "tag" ]; then
            echo "::error::tag $TAG is $OT, not an annotated tag; the verbatim patchnotes entry is unavailable"
            exit 1
          fi
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > /tmp/release-notes.md
          TITLE="$(head -1 /tmp/release-notes.md)"
          gh release create "$TAG" --verify-tag --notes-file /tmp/release-notes.md --title "$TITLE"
